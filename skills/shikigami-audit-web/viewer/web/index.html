<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents en direct</title>
<style>
  :root {
    --bg: #f6f3fb; --panel: #ffffff; --text: #2b2440; --muted: #6b6385; --line: #e3ddf0;
    --accent: #7a5cff; --ok: #23865a; --err: #c93838;
    --st-pass: #23865a; --st-partial: #b7791f; --st-fail: #c93838; --st-check: #6d4fd8; --st-na: #8e889f;
    --floor-a: #efe4d2; --floor-b: #e6d6bf; --seam: #d8c6ab;
    --wall: #d9cff0; --wall-trim: #b3a5dc; --window: #bfe7ff; --window-glare: #e8f7ff;
    --desk-top: #d9b085; --desk-front: #a97f57; --monitor: #3b3f58; --glow: #8fe3ff;
    --table-top: #c69466; --table-front: #94673f; --rug: #f6c6d3; --rug-edge: #eaa3b6;
    --plant: #5fb468; --plant-dark: #3f8d4a; --pot: #c7714b; --chair: #8c7fd6;
    --printer: #e9e6f2; --printer-dark: #9b95ae;
    --skin: #ffe2cc; --blush: #ff9fb2; --eye: #2b2440; --mouth: #c0607a; --leg: #3a3550;
    --paper: #ffffff; --paper-line: #b9b2cc; --bubble: #ffffff; --bubble-line: #2b2440;
    --shadow: rgba(43, 36, 64, 0.18); --sweat: #6cc4ff; --spark: #ffd84d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17141f; --panel: #211d2c; --text: #ece8f6; --muted: #a59dbd; --line: #332d44;
      --accent: #a28bff; --ok: #5fd39b; --err: #ff7a7a;
      --st-pass: #5fd39b; --st-partial: #f3c160; --st-fail: #ff7a7a; --st-check: #b9a6ff; --st-na: #8f88a6;
      --floor-a: #3a3245; --floor-b: #342c3e; --seam: #2a2433;
      --wall: #2c2540; --wall-trim: #463b66; --window: #1d2b52; --window-glare: #f5e9a8;
      --desk-top: #8a6a4c; --desk-front: #5e4632; --table-top: #7d5d40; --table-front: #563e2a;
      --rug: #6b3d52; --rug-edge: #563043; --shadow: rgba(0, 0, 0, 0.35); --chair: #4b3f7d;
      --printer: #8f89a3; --printer-dark: #5b556e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17141f; --panel: #211d2c; --text: #ece8f6; --muted: #a59dbd; --line: #332d44;
    --accent: #a28bff; --ok: #5fd39b; --err: #ff7a7a;
    --st-pass: #5fd39b; --st-partial: #f3c160; --st-fail: #ff7a7a; --st-check: #b9a6ff; --st-na: #8f88a6;
    --floor-a: #3a3245; --floor-b: #342c3e; --seam: #2a2433;
    --wall: #2c2540; --wall-trim: #463b66; --window: #1d2b52; --window-glare: #f5e9a8;
    --desk-top: #8a6a4c; --desk-front: #5e4632; --table-top: #7d5d40; --table-front: #563e2a;
    --rug: #6b3d52; --rug-edge: #563043; --shadow: rgba(0, 0, 0, 0.35); --chair: #4b3f7d;
    --printer: #8f89a3; --printer-dark: #5b556e;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 16px 16px 8px; }
  h1 { margin: 0; font-size: 18px; }
  h2 { margin: 0 0 8px; font-size: 14px; }
  .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
  .conn::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .conn[data-state="open"]::before { background: var(--ok); }
  .conn[data-state="closed"]::before { background: var(--err); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 8px 16px 16px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-width: 0; }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; }
  aside { display: grid; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 32px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* agent list: each row is a button that opens the detail panel */
  ol.agents { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .row { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 2px 8px; width: 100%; padding: 6px; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .row:hover { background: var(--bg); }
  .row[aria-pressed="true"] { background: var(--bg); box-shadow: inset 0 0 0 1px var(--accent); }
  .swatch { width: 12px; height: 12px; border-radius: 3px; margin-top: 4px; }
  .name { font-weight: 600; }
  .status { grid-column: 2; justify-self: start; font-size: 12px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .status[data-s="done"] { color: var(--ok); border-color: currentColor; }
  .status[data-s="error"] { color: var(--err); border-color: currentColor; }
  .status[data-s="work"], .status[data-s="away"] { color: var(--accent); border-color: currentColor; }
  .doing, .stats { grid-column: 2; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .progress { grid-column: 2; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); }
  .empty { color: var(--muted); }

  /* detail panel */
  .detail { display: grid; gap: 10px; }
  .detail-head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  .detail h2 { margin: 0; font-size: 16px; }
  .detail .meaning { color: var(--muted); font-size: 12px; }
  .detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-size: 13px; }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; font-variant-numeric: tabular-nums; }
  .detail h3 { margin: 0; font-size: 13px; }
  .detail ul, .detail ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 12px; }
  .detail li { display: flex; gap: 6px; align-items: baseline; }
  .tag { flex: none; font-size: 11px; padding: 0 5px; border-radius: 4px; background: var(--bg); color: var(--muted); }
  .tag.rule { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 12px; padding: 0 7px; border-radius: 999px; border: 1px solid currentColor; }
  .chip.pass { color: var(--st-pass); } .chip.partial { color: var(--st-partial); } .chip.fail { color: var(--st-fail); }
  .chip.check { color: var(--st-check); } .chip.na { color: var(--st-na); }

  /* overlays on the scene */
  .tip { position: absolute; z-index: 2; pointer-events: none; max-width: 260px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 12px; box-shadow: 0 2px 8px var(--shadow); }
  .endcard { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(380px, calc(100% - 32px)); display: grid; gap: 10px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 6px 24px var(--shadow); }
  .endcard .title { font-weight: 700; font-size: 16px; }
  .endcard ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; }
  .endcard li { display: grid; gap: 2px; }
  .endcard .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* replay controls (exported files only) */
  .replay { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; }
  .replay input[type="range"] { flex: 1 1 200px; accent-color: var(--accent); }
  .replay .time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .replay select { font: inherit; font-size: 13px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; min-height: 32px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Agents en direct</h1>
  <span class="meta" id="run">En attente des agents…</span>
  <span class="meta" id="clock">00:00</span>
  <span class="meta conn" id="conn" data-state="connecting">Connexion…</span>
</header>
<main>
  <div class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="Vue animée du bureau des agents. Le détail de chaque agent est dans la liste."></canvas>
    <div class="tip" id="tip" hidden></div>
    <div class="endcard" id="endcard" role="region" aria-labelledby="endTitle" hidden>
      <p class="title" id="endTitle" style="margin:0">Passage terminé</p>
      <p class="meta" id="endMeta" style="margin:0"></p>
      <ul id="endList"></ul>
      <div class="actions">
        <button class="btn" type="button" id="endReplay" hidden>Revoir le passage</button>
        <button class="btn" type="button" id="endClose">Fermer</button>
      </div>
    </div>
    <div class="replay" id="replay" hidden>
      <button class="btn" type="button" id="playBtn">Pause</button>
      <input type="range" id="seek" min="0" max="1000" step="100" value="0" aria-label="Position dans le rejeu">
      <span class="time" id="seekTime">00:00 / 00:00</span>
      <label class="time" for="speedSel">Vitesse
        <select id="speedSel"><option value="1">×1</option><option value="5">×5</option><option value="20">×20</option></select>
      </label>
    </div>
  </div>
  <aside>
    <section class="card" aria-labelledby="agentsTitle">
      <h2 id="agentsTitle">Agents</h2>
      <ol class="agents" id="agents"></ol>
      <p class="empty" id="emptyList">Aucun agent pour l’instant.</p>
    </section>
    <section class="card detail" id="detail" aria-labelledby="detailName" hidden>
      <div class="detail-head">
        <div>
          <h2 id="detailName"></h2>
          <p class="meaning" id="detailMeaning" style="margin:0"></p>
        </div>
        <button class="btn" type="button" id="detailClose" aria-label="Fermer le détail">×</button>
      </div>
      <dl id="detailFacts"></dl>
      <div class="chips" id="detailChips"></div>
      <h3 id="detailErrorsTitle">Erreurs</h3>
      <ul id="detailErrors"></ul>
      <h3>Dernières actions</h3>
      <ol id="detailHistory"></ol>
    </section>
  </aside>
</main>
<p class="sr-only" id="announce" aria-live="polite"></p>

<script src="sprites.js"></script>
<script>
(() => {
  // ---------- constants ----------
  const W = 384, H = 224, WALL = 30;
  // px per second in world space; ?walk=1.5 in the URL speeds walking up for short previews
  const WALK_SPEED = 46 * Math.min(4, Math.max(0.25, Number(new URLSearchParams(location.search).get("walk")) || 1));
  const LIST_TICK_MS = 250, LIST_REFRESH_MS = 1000;
  const BUBBLE_MS = 1800, THINK_AFTER_MS = 2200, COFFEE_AFTER_MS = 12000, SWEAT_MS = 2400;
  const CELEBRATE_MS = 1600, BULB_MS = 900, CHEER_MS = 1000;
  // Above this replay speed, agents skip their trips round the office and stay at their desks.
  const MAX_TRIP_SPEED = 5;
  const HISTORY_SIZE = 12, ERRORS_SHOWN = 5;
  const DOOR = [192, 218];
  const TABLE = { x: 192, y: 140, w: 48, h: 20 };
  const SLOTS = [[64, 64], [320, 64], [64, 116], [320, 116], [64, 168], [320, 168], [146, 64], [238, 64]];
  const SPOTS = { left: [[156, 132], [156, 154], [176, 176], [176, 110]], right: [[228, 132], [228, 154], [208, 176], [208, 110]] };
  // Where actions happen: reference docs on the shelves, the live site at the windows, results at the printer.
  const PLACES = { shelf: [[109, 46], [293, 46]], window: [[44, 46], [340, 46]], printer: [[300, 210]] };
  const CORRIDOR_X = { left: 116, right: 268, lead: 140 };
  const LEAD_BOARD = [192, 46], LEAD_TABLE = [192, 122];
  const STATUSES = ["pass", "partial", "fail", "check", "na"];
  const STATUS_LABEL = {
    pass: (n) => `${n} conforme${n > 1 ? "s" : ""}`,
    partial: (n) => `${n} partielle${n > 1 ? "s" : ""}`,
    fail: (n) => `${n} non conforme${n > 1 ? "s" : ""}`,
    check: (n) => `${n} à vérifier`,
    na: (n) => `${n} N/A`,
  };
  const STATE_LABEL = {
    walkIn: "Arrive", work: "Au travail", think: "Réfléchit", error: "Erreur", deliver: "Rend sa copie",
    celebrate: "Terminé", idle: "Terminé", board: "Supervise", merge: "Fusionne les copies",
  };
  const PLACE_LABEL = { shelf: "Consulte les références", window: "Teste le site en ligne", printer: "Imprime ses résultats" };
  const ICON_LABEL = { web: "Web", read: "Lecture", run: "Commande", write: "Écriture" };
  const ICONS = {
    web:   ["..####..", ".#.##.#.", "#..##..#", "########", "#..##..#", ".#.##.#.", "..####.."],
    read:  [".##..##.", "#..##..#", "#..##..#", "#..##..#", "#..##..#", ".##..##.", "...##..."],
    run:   ["########", "#......#", "#.#....#", "#..#...#", "#.#.##.#", "#......#", "########"],
    write: [".....##.", "....#.##", "...#.#..", "..#.#...", ".#.#....", "##......", "###....."],
    bulb:  ["..###..", ".#...#.", ".#...#.", "..#.#..", "..###..", "..###..", "...#..."],
    coffee: [".#.#...", "..#.#..", "#####..", "#...###", "#...#.#", "#...###", ".###..."],
  };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const $ = (id) => document.getElementById(id);

  // ---------- canvas setup ----------
  const view = $("scene");
  const v = view.getContext("2d");
  const world = document.createElement("canvas");
  world.width = W; world.height = H;
  const g = world.getContext("2d");
  let scale = 2;

  const C = {};
  const readColors = () => {
    const s = getComputedStyle(document.documentElement);
    for (const sheet of document.styleSheets) for (const rule of sheet.cssRules) {
      if (rule.selectorText !== ":root") continue;
      for (const name of rule.style) if (name.startsWith("--")) C[name.slice(2)] = s.getPropertyValue(name).trim();
    }
  };
  readColors();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);

  const resize = () => {
    const dpr = devicePixelRatio || 1;
    const cssW = view.parentElement.clientWidth - 16;
    // Backing store at an integer multiple, then CSS stretches it to the column width.
    const next = Math.max(2, Math.ceil((cssW * dpr) / W));
    if (next === scale && view.width === W * scale) return;
    scale = next;
    view.width = W * scale; view.height = H * scale;
  };
  new ResizeObserver(resize).observe(view.parentElement);

  const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
  const icon = (rows, x, y, c) => rows.forEach((r, j) => [...r].forEach((ch, i) => ch === "#" && px(x + i, y + j, 1, 1, c)));

  // ---------- state ----------
  const agents = new Map(); // includes the lead, flagged `lead`
  let papers = 0, firstT = 0, lastT = 0, ended = false, mode = "live", speed = 1;
  let selected = null;
  const used = { left: 0, right: 0 };
  const replayControl = () => window.ReplayControl ?? null;
  const currentSpeed = () => replayControl()?.speed ?? speed;
  const workers = () => [...agents.values()].filter((a) => !a.lead);
  const leadAgent = () => [...agents.values()].find((a) => a.lead) ?? null;
  const tripsAllowed = () => !reduceMotion.matches && currentSpeed() <= MAX_TRIP_SPEED;

  const sideOf = (a) => (a.lead ? "lead" : a.slot[0] < W / 2 ? "left" : "right");
  // Manhattan route along the agent's corridor, so nobody walks through a desk or the table.
  const route = (from, to, cx) => [[cx, from[1]], [cx, to[1]], to];
  const nearest = (list, x) => list.reduce((best, p) => (Math.abs(p[0] - x) < Math.abs(best[0] - x) ? p : best));

  const go = (a, path, onArrive, instant = false) => {
    a.onArrive = onArrive;
    a.path = path.map((p) => [...p]);
    if (instant || reduceMotion.matches) {
      const last = a.path.at(-1);
      a.x = last[0]; a.y = last[1]; a.path = []; a.moving = false;
      const cb = a.onArrive; a.onArrive = null; cb?.();
    }
  };

  const sitDown = (a) => {
    a.state = "work"; a.face = "down"; a.place = null; a.lastAct = performance.now();
    if (a.pendingDone) leave(a, false);
  };

  // Send an agent to a place (or back to its desk with null); the latest wish wins.
  const want = (a, place) => {
    a.wantPlace = place;
    if (a.state === "work" && !a.moving) travel(a);
  };
  const travel = (a) => {
    const target = a.wantPlace ?? null;
    if (target === a.place) return;
    a.place = target;
    const dest = target ? nearest(PLACES[target], a.slot[0]) : a.slot;
    go(a, route([a.x, a.y], dest, CORRIDOR_X[sideOf(a)]), () => {
      a.face = target ? "up" : "down";
      if ((a.wantPlace ?? null) !== a.place) travel(a);
    });
  };

  const leave = (a, instant) => {
    if (a.state === "walkIn") { a.pendingDone = true; return; }
    a.state = "deliver"; a.carrying = true; a.bubble = null; a.place = null; a.wantPlace = null;
    const side = sideOf(a);
    const list = SPOTS[side];
    const n = used[side]++;
    const [tx, ty] = list[n % list.length];
    const spot = [tx, ty + Math.floor(n / list.length) * 6];
    go(a, route([a.x, a.y], spot, CORRIDOR_X[side]), () => {
      papers++; a.carrying = false; a.face = "down";
      if (instant) { a.state = "idle"; return; }
      a.state = "celebrate"; a.until = performance.now() + CELEBRATE_MS;
      // the ones already at the table cheer along
      for (const o of workers()) if (o !== a && o.state === "idle") { o.state = "celebrate"; o.until = performance.now() + CHEER_MS; }
    }, instant || reduceMotion.matches);
  };

  const newAgent = (ev, extra) => ({
    id: ev.agentId, label: ev.label, x: DOOR[0], y: DOOR[1], path: [], face: "up", moving: false,
    tools: 0, errors: 0, errorLog: [], history: [], rules: new Set(), text: "", startT: ev.t, endT: null,
    summary: null, phase: Math.random() * 10, bubble: null, bubbleUntil: 0, sweatUntil: 0, bulbUntil: 0,
    lastAct: performance.now(), lastThink: 0, pendingDone: false, carrying: false, until: 0,
    place: null, wantPlace: null, onArrive: null, ...extra,
  });

  const spawnLead = (ev, instant) => {
    const sprites = SPRITES.framesFor(SPRITES.LEAD);
    const a = newAgent(ev, { lead: true, theme: "Coordination", name: sprites.look.name, sprites, hair: sprites.look.hair, state: "walkIn", slot: LEAD_BOARD, i: -1 });
    agents.set(a.id, a);
    go(a, route(DOOR, LEAD_BOARD, CORRIDOR_X.lead), () => { a.state = "board"; a.face = "down"; maybeMerge(instant); }, instant);
    if (!instant) announce(`${a.name} arrive pour coordonner l’audit.`);
  };

  const spawn = (ev, instant) => {
    if (agents.has(ev.agentId)) return;
    if (ev.lead) { spawnLead(ev, instant); return; }
    const i = workers().length;
    const slot = SLOTS[i % SLOTS.length];
    // The character follows the theme in the label, so a theme always gets the same one.
    const taken = new Set(workers().map((x) => x.look));
    const look = SPRITES.lookIndexFor(ev.label, taken);
    const sprites = SPRITES.framesFor(look);
    // "Opquast · Navigation & présentation (14)" → theme + number of rules to check
    const m = ev.label.match(/·\s*(.+?)(?:\s*\((\d+)\))?\s*$/);
    const a = newAgent(ev, {
      theme: m ? m[1] : ev.label, total: m?.[2] ? Number(m[2]) : null, name: sprites.look.name,
      look, i, slot, sprites, hair: sprites.look.hair, state: "walkIn",
    });
    agents.set(a.id, a);
    go(a, route(DOOR, slot, CORRIDOR_X[sideOf(a)]), () => sitDown(a), instant);
    if (!instant) announce(`${a.name} (${a.theme}) arrive.`);
  };

  // Once every agent has handed in, the lead walks to the table to merge the copies.
  const maybeMerge = (instant) => {
    const lead = leadAgent();
    const ws = workers();
    if (!lead || lead.state !== "board" || !ws.length || ws.some((a) => !a.endT)) return;
    lead.state = "merge";
    go(lead, route([lead.x, lead.y], LEAD_TABLE, CORRIDOR_X.lead), () => { lead.face = "down"; }, instant);
  };

  const apply = (ev, instant = false) => {
    if (ev.t) { firstT = firstT || ev.t; lastT = Math.max(lastT, ev.t); }
    const a = agents.get(ev.agentId);
    const now = performance.now();
    switch (ev.kind) {
      case "reset":
        agents.clear(); papers = 0; firstT = lastT = 0; ended = false; used.left = used.right = 0;
        mode = ev.mode ?? "live"; speed = ev.speed ?? 1;
        clearList(); hideEndCard();
        break;
      case "spawn": spawn(ev, instant); break;
      case "tool": {
        if (!a) break;
        a.tools++; a.text = ev.text;
        if (ev.rule) a.rules.add(ev.rule);
        a.history.push({ t: ev.t, icon: ev.icon, text: ev.text, rule: ev.rule });
        if (a.history.length > HISTORY_SIZE * 4) a.history.splice(0, a.history.length - HISTORY_SIZE);
        if (!instant) {
          // a long think that ends in an action gets a lightbulb
          if (now - a.lastAct > THINK_AFTER_MS) a.bulbUntil = now + BULB_MS;
          a.bubble = ev.icon; a.bubbleUntil = now + BUBBLE_MS;
          if (!a.lead && tripsAllowed()) want(a, ev.place ?? null);
        }
        a.lastAct = now;
        break;
      }
      case "think": if (a) a.lastThink = now; break;
      case "error":
        if (!a) break;
        a.errors++;
        a.errorLog.push({ t: ev.t, text: ev.text ?? "Une action a échoué" });
        if (!instant) a.sweatUntil = now + SWEAT_MS;
        break;
      case "done":
        if (!a) break;
        a.endT = ev.t; a.text = "Résultats rendus"; a.summary = ev.summary ?? null;
        if (a.summary && !a.total) a.total = STATUSES.reduce((n, k) => n + (a.summary[k] ?? 0), 0);
        leave(a, instant);
        if (!instant) announce(`${a.name} a terminé.`);
        maybeMerge(instant);
        break;
      case "end": {
        ended = true;
        const lead = leadAgent();
        if (lead) { lead.endT = ev.t; lead.text = "Audit terminé"; if (!instant) { lead.state = "celebrate"; lead.until = now + CELEBRATE_MS; } else lead.state = "idle"; }
        showEndCard();
        if (!instant) announce("Tous les agents ont terminé.");
        break;
      }
    }
    dirty = true;
  };

  // ---------- list, detail panel, end card ----------
  const list = $("agents"), runEl = $("run"), clockEl = $("clock"), announceEl = $("announce");
  const rows = new Map();
  let dirty = true;
  const announce = (msg) => { announceEl.textContent = msg; };
  const mmss = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

  const statusOf = (a, now) => {
    if (a.endT && !a.lead) return "done";
    if (a.state === "work" && now < a.sweatUntil) return "error";
    if (a.state === "work" && a.place) return "away";
    if ((a.state === "work" || a.state === "board" || a.state === "merge") && now - a.lastAct > THINK_AFTER_MS) return a.state === "work" ? "think" : a.state;
    return a.state;
  };
  const statusText = (a, s) => (s === "done" ? "Terminé" : s === "away" ? PLACE_LABEL[a.place] : STATE_LABEL[s] ?? s);
  const progressText = (a) => {
    if (a.lead) return null;
    if (a.total) return `${a.endT ? a.total : Math.min(a.rules.size, a.total)}/${a.total} règles`;
    return a.rules.size ? `${a.rules.size} règles` : null;
  };
  const progressRatio = (a) => (a.lead ? null : a.endT ? 1 : a.total ? Math.min(1, a.rules.size / a.total) : null);

  const clearList = () => { rows.clear(); list.replaceChildren(); select(null); };

  const rowFor = (a) => {
    let r = rows.get(a.id);
    if (r) return r;
    const li = el("li");
    const btn = el("button", "row");
    btn.type = "button";
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-controls", "detail");
    const swatch = el("span", "swatch"); swatch.style.background = a.hair; swatch.setAttribute("aria-hidden", "true");
    const name = el("span", "name", a.lead ? `${a.name} · Coordination` : `${a.name} · ${a.theme}`);
    const status = el("span", "status"), doing = el("span", "doing"), stats = el("span", "stats");
    const progress = el("span", "progress"); progress.setAttribute("aria-hidden", "true");
    const fill = el("i"); progress.append(fill);
    btn.append(swatch, name, status, doing, progress, stats);
    btn.addEventListener("click", () => select(selected === a.id ? null : a.id));
    li.append(btn);
    // the lead's row goes first
    if (a.lead) list.prepend(li); else list.append(li);
    r = { btn, status, doing, stats, progress, fill };
    rows.set(a.id, r);
    return r;
  };

  const renderList = (now) => {
    const ws = workers();
    const done = ws.filter((a) => a.endT).length;
    const rc = replayControl();
    const replayText = mode === "replay" || rc ? ` · rejeu ×${currentSpeed()}` : "";
    runEl.textContent = ws.length ? `${done}/${ws.length} terminés${replayText}${ended ? " · fin du passage" : ""}` : "En attente des agents…";
    clockEl.textContent = mmss(lastT - firstT);
    $("emptyList").hidden = agents.size > 0;
    for (const a of agents.values()) {
      const r = rowFor(a);
      const s = statusOf(a, now);
      r.status.textContent = statusText(a, s);
      r.status.dataset.s = s;
      r.doing.textContent = a.text || "—";
      const elapsed = (a.endT ?? lastT) - a.startT;
      r.stats.textContent = [progressText(a), `${a.tools} actions`, `${a.errors} erreur${a.errors > 1 ? "s" : ""}`, mmss(elapsed)].filter(Boolean).join(" · ");
      const ratio = progressRatio(a);
      r.progress.hidden = ratio == null;
      if (ratio != null) r.fill.style.width = `${Math.round(ratio * 100)}%`;
      r.btn.setAttribute("aria-pressed", String(selected === a.id));
    }
    renderDetail(now);
    renderReplay();
  };

  const select = (id) => {
    const prev = selected;
    selected = id && agents.has(id) ? id : null;
    $("detail").hidden = !selected;
    if (!selected && prev) rows.get(prev)?.btn.focus();
    dirty = true;
  };

  const renderDetail = (now) => {
    const a = selected && agents.get(selected);
    if (!a) return;
    $("detailName").textContent = a.name;
    $("detailMeaning").textContent = a.sprites.look.meaning;
    const facts = [
      ["Thèmes", a.lead ? "Coordination de l’audit" : a.theme],
      ["Statut", statusText(a, statusOf(a, now))],
      ["Règles", progressText(a)],
      ["Durée", mmss((a.endT ?? lastT) - a.startT)],
      ["Actions", String(a.tools)],
      ["Erreurs", String(a.errors)],
    ].filter(([, val]) => val);
    $("detailFacts").replaceChildren(...facts.flatMap(([k, val]) => [el("dt", null, k), el("dd", null, val)]));
    $("detailChips").replaceChildren(...(a.summary ? STATUSES.map((k) => el("span", `chip ${k}`, STATUS_LABEL[k](a.summary[k] ?? 0))) : []));
    const errs = a.errorLog.slice(-ERRORS_SHOWN).reverse();
    $("detailErrorsTitle").hidden = !errs.length;
    $("detailErrors").replaceChildren(...errs.map((e) => el("li", null, e.text)));
    $("detailHistory").replaceChildren(...a.history.slice(-HISTORY_SIZE).reverse().map((h) => {
      const li = el("li");
      li.append(el("span", "tag", ICON_LABEL[h.icon] ?? h.icon));
      if (h.rule) li.append(el("span", "tag rule", `R${h.rule}`));
      li.append(el("span", null, h.text));
      return li;
    }));
  };

  $("detailClose").addEventListener("click", () => select(null));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && selected) select(null); });

  const endcard = $("endcard");
  const hideEndCard = () => { endcard.hidden = true; };
  const showEndCard = () => {
    const ws = workers();
    const lastEnd = Math.max(...ws.map((a) => a.endT ?? 0), lastT);
    $("endMeta").textContent = `${ws.length} agents · ${mmss(lastEnd - firstT)}`;
    $("endList").replaceChildren(...ws.map((a) => {
      const li = el("li");
      li.append(el("strong", null, `${a.name} · ${a.theme}`));
      const line = a.summary ? STATUSES.filter((k) => a.summary[k]).map((k) => STATUS_LABEL[k](a.summary[k])).join(", ") : "Résultats rendus";
      li.append(el("span", "meta", `${line} · ${mmss((a.endT ?? lastEnd) - a.startT)}`));
      return li;
    }));
    $("endReplay").hidden = !replayControl();
    endcard.hidden = false;
  };
  $("endClose").addEventListener("click", hideEndCard);
  $("endReplay").addEventListener("click", () => { hideEndCard(); replayControl()?.seek(0); replayControl()?.play(); });

  // ---------- replay controls (only when the page is an exported replay) ----------
  const replayBar = $("replay"), seek = $("seek"), playBtn = $("playBtn"), speedSel = $("speedSel");
  let seeking = false;
  const renderReplay = () => {
    const rc = replayControl();
    replayBar.hidden = !rc;
    if (!rc) return;
    seek.max = String(Math.max(1, Math.round(rc.duration)));
    if (!seeking) seek.value = String(Math.round(rc.position));
    seek.setAttribute("aria-valuetext", `${mmss(rc.position)} sur ${mmss(rc.duration)}`);
    $("seekTime").textContent = `${mmss(rc.position)} / ${mmss(rc.duration)}`;
    playBtn.textContent = rc.playing ? "Pause" : "Lecture";
    speedSel.value = String(rc.speed);
  };
  seek.addEventListener("input", () => { seeking = true; $("seekTime").textContent = `${mmss(Number(seek.value))} / ${mmss(replayControl()?.duration ?? 0)}`; });
  seek.addEventListener("change", () => { seeking = false; hideEndCard(); replayControl()?.seek(Number(seek.value)); });
  playBtn.addEventListener("click", () => { const rc = replayControl(); if (!rc) return; if (rc.playing) rc.pause(); else { hideEndCard(); rc.play(); } dirty = true; });
  speedSel.addEventListener("change", () => { replayControl()?.setSpeed(Number(speedSel.value)); dirty = true; });

  // ---------- drawing ----------
  const O = SPRITES.OUTLINE;
  const BOOKS = ["#e76f8a", "#5b8dff", "#f2cf4a", "#6fd6a0", "#b38cff", "#ff9f5b"];
  const WINDOWS = [44, 340];
  const box = (x, y, w, h, fill, outline = O) => { px(x, y, w, h, outline); px(x + 1, y + 1, w - 2, h - 2, fill); };

  const drawWindow = (wx) => {
    box(wx - 17, 4, 34, 20, C["wall-trim"]);
    px(wx - 15, 6, 30, 16, C.window);
    px(wx - 1, 6, 2, 16, C["wall-trim"]);
    px(wx - 15, 13, 30, 1, C["wall-trim"]);
    px(wx - 12, 8, 4, 2, C["window-glare"]);
    px(wx + 3, 15, 3, 2, C["window-glare"]);
  };

  const drawShelf = (x) => {
    box(x, 3, 34, 26, C["desk-front"]);
    for (const sy of [10, 18, 26]) px(x + 1, sy, 32, 1, O);
    let k = 0;
    for (const top of [4, 12, 20]) {
      for (let bx = x + 2; bx < x + 31; k++) {
        const w = 2 + (k % 3 === 0 ? 1 : 0), h = 5 - (k % 4 === 1 ? 1 : 0);
        if (k % 7 === 5) { bx += 3; continue; }
        px(bx, top + 6 - h, w, h, BOOKS[k % BOOKS.length]);
        px(bx, top + 6 - h, w, 1, SPRITES.mix(BOOKS[k % BOOKS.length], 0.4));
        bx += w + 1;
      }
    }
  };

  // The whiteboard doubles as the scoreboard: one bar per agent, filled with its results.
  const drawBoard = (cx) => {
    box(cx - 26, 4, 52, 22, C.paper);
    px(cx - 26, 25, 52, 2, C["wall-trim"]);
    const ws = workers();
    if (!ws.length) {
      px(cx - 22, 8, 16, 1, C.accent); px(cx - 22, 11, 12, 1, C.muted); px(cx - 22, 14, 14, 1, C.muted);
      px(cx - 22, 18, 8, 1, C.err); px(cx - 12, 18, 6, 1, C.ok);
      for (const [nx, ny, col] of [[cx + 2, 7, "#ffe27a"], [cx + 10, 7, "#ffb3c7"], [cx + 18, 7, "#b8f0d0"], [cx + 6, 15, "#bcd7ff"], [cx + 14, 15, "#ffe27a"]]) {
        px(nx, ny, 6, 6, col); px(nx + 1, ny + 2, 4, 1, SPRITES.mix(col, -0.3));
      }
      return;
    }
    const barW = 40;
    ws.slice(0, 4).forEach((a, i) => {
      const y = 7 + i * 4;
      px(cx - 23, y, 3, 3, a.hair);
      px(cx - 18, y, barW, 3, C.line);
      if (a.summary) {
        const total = STATUSES.reduce((n, k) => n + (a.summary[k] ?? 0), 0) || 1;
        let x = cx - 18;
        for (const k of STATUSES) {
          const w = Math.round((a.summary[k] ?? 0) / total * barW);
          if (w) px(x, y, w, 3, C[`st-${k}`]);
          x += w;
        }
      } else {
        const ratio = progressRatio(a);
        if (ratio) px(cx - 18, y, Math.round(ratio * barW), 3, C.accent);
      }
    });
  };

  const drawClock = (cx, now) => {
    box(cx - 6, 6, 12, 12, C.paper);
    px(cx - 6, 6, 1, 1, C.wall); px(cx + 5, 6, 1, 1, C.wall); px(cx - 6, 17, 1, 1, C.wall); px(cx + 5, 17, 1, 1, C.wall);
    px(cx, 9, 1, 3, O);
    const t = Math.floor(now / 1000) % 4;
    const hand = [[1, 0, 3, 1], [0, 1, 1, 3], [-3, 0, 3, 1], [0, -3, 1, 3]][t];
    px(cx + hand[0], 12 + hand[1], hand[2], hand[3], C.accent);
  };

  const drawPlant = (x, y) => {
    box(x + 1, y + 8, 10, 9, C.pot);
    px(x + 2, y + 9, 8, 1, SPRITES.mix(C.pot || "#c7714b", 0.3));
    box(x - 1, y, 14, 10, C.plant, C["plant-dark"]);
    box(x + 3, y - 4, 7, 6, C.plant, C["plant-dark"]);
    px(x + 2, y + 3, 3, 2, C["plant-dark"]); px(x + 7, y + 5, 3, 2, C["plant-dark"]); px(x + 5, y - 2, 2, 2, C["plant-dark"]);
  };

  const drawPrinter = (now) => {
    const [x, y] = [PLACES.printer[0][0] - 9, PLACES.printer[0][1] - 22];
    px(x, y + 14, 18, 3, C.shadow);
    box(x, y, 18, 14, C.printer);
    px(x + 1, y + 1, 16, 2, SPRITES.mix(C.printer || "#e9e6f2", 0.4));
    px(x + 3, y + 6, 12, 2, C["printer-dark"]);
    box(x + 4, y - 3, 10, 4, C.paper, C["paper-line"]);
    const busy = workers().some((a) => a.place === "printer" && !a.moving);
    px(x + 14, y + 10, 2, 2, busy && Math.floor(now / 250) % 2 ? C.ok : C["printer-dark"]);
  };

  const drawRoom = (now) => {
    for (let y = WALL, row = 0; y < H; y += 8, row++) {
      px(0, y, W, 8, row % 2 ? C["floor-a"] : C["floor-b"]);
      for (let x = (row * 13) % 40; x < W; x += 40) px(x, y, 1, 8, C.seam);
      px(0, y + 7, W, 1, C.seam);
    }
    g.globalAlpha = 0.14;
    for (const wx of WINDOWS) for (let r = 0; r < 34; r++) px(wx - 14 + Math.round(r * 0.5), WALL + r, 28, 1, C.window);
    g.globalAlpha = 1;
    px(0, 0, W, WALL, C.wall);
    px(0, WALL - 4, W, 4, C["wall-trim"]);
    px(0, WALL, W, 2, C.shadow);
    WINDOWS.forEach(drawWindow);
    drawShelf(92);
    drawBoard(192);
    drawClock(258, now);
    drawShelf(276);
    box(TABLE.x - 46, TABLE.y - 28, 92, 58, C.rug, C["rug-edge"]);
    for (let x = TABLE.x - 42; x < TABLE.x + 42; x += 6) { px(x, TABLE.y - 25, 3, 1, C["rug-edge"]); px(x + 3, TABLE.y + 26, 3, 1, C["rug-edge"]); }
    box(DOOR[0] - 16, H - 7, 32, 7, C["wall-trim"]);
    for (const [x, y] of [[8, 40], [W - 20, 40], [8, H - 22], [W - 20, H - 22]]) drawPlant(x, y);
  };

  const drawTable = () => {
    const { x, y, w, h } = TABLE;
    px(x - w / 2 - 1, y + h / 2 + 6, w + 2, 3, C.shadow);
    box(x - w / 2 - 1, y - h / 2 - 1, w + 2, h + 8, C["table-top"]);
    px(x - w / 2, y + h / 2, w, 6, C["table-front"]);
    px(x - w / 2, y - h / 2, w, 1, SPRITES.mix(C["table-top"] || "#c69466", 0.3));
    for (let i = 0; i < papers; i++) {
      const col = i % 4, row = Math.floor(i / 4);
      const fx = x - 18 + col * 10, fy = y - 7 + (row % 2) * 2 - Math.floor(row / 2);
      box(fx, fy - 1, 8, 10, C.paper, C["paper-line"]);
      px(fx + 2, fy + 1, 4, 1, C["paper-line"]);
      px(fx + 2, fy + 3, 3, 1, C["paper-line"]);
      px(fx + 2, fy + 5, 4, 1, C["paper-line"]);
    }
  };

  const drawChair = ([sx, sy]) => {
    // Wider than the head so the backrest shows on both sides of the seated character.
    box(sx - 10, sy - 21, 20, 16, C.chair);
    px(sx - 9, sy - 20, 18, 2, SPRITES.mix(C.chair || "#7a6cc4", 0.3));
  };

  const drawDesk = (a, now) => {
    const [sx, sy] = a.slot;
    const active = a.state === "work" && !a.place && !a.moving;
    px(sx - 16, sy + 13, 34, 3, C.shadow);
    box(sx - 17, sy - 4, 34, 17, C["desk-top"]);
    px(sx - 16, sy + 6, 32, 6, C["desk-front"]);
    px(sx - 16, sy + 6, 32, 1, O);
    px(sx - 15, sy + 13, 2, 3, O); px(sx + 13, sy + 13, 2, 3, O);
    // Low enough that the whole face stays visible above it.
    box(sx - 8, sy - 9, 16, 7, C.monitor);
    px(sx - 2, sy - 3, 4, 3, O);
    if (active) px(sx - 7, sy - 10, 14, 1, (Math.floor(now / 350 + a.phase) % 3 && !reduceMotion.matches) ? C.glow : C.window);
    box(sx + 10, sy - 2, 5, 5, C.paper);
    px(sx + 15, sy - 1, 1, 2, O);
    if (active && !reduceMotion.matches) {
      const f = Math.floor(now / 300 + a.phase) % 3;
      g.globalAlpha = 0.7; px(sx + 11 + (f % 2), sy - 5 - f, 1, 2, C.paper); g.globalAlpha = 1;
    }
    if (a.i % 2) { px(sx - 15, sy - 2, 6, 2, BOOKS[a.i % 6]); px(sx - 14, sy - 4, 5, 2, BOOKS[(a.i + 2) % 6]); }
    else { box(sx - 15, sy - 3, 5, 5, C.pot); px(sx - 15, sy - 7, 5, 4, C.plant); }
  };

  // Accessory pixels are given in sprite space (0–15), so mirroring for "left" is free.
  const drawAccessory = (a, ox, oy, flip) => {
    const view = a.face === "up" ? "up" : a.face === "down" ? "down" : "side";
    const hair = a.sprites.pal.h, dark = a.sprites.pal.H;
    const p = (i, j, w, h, c) => px(flip ? ox + 16 - i - w : ox + i, oy + j, w, h, c);
    switch (a.sprites.look.acc) {
      case "headphones":
      case "headset":
        p(3, -1, 10, 1, O); p(2, 0, 1, 3, O); p(13, 0, 1, 3, O);
        if (view === "side") { p(5, 7, 3, 5, O); p(6, 8, 1, 3, C.accent); }
        else { p(0, 8, 3, 5, O); p(1, 9, 1, 3, C.accent); p(13, 8, 3, 5, O); p(14, 9, 1, 3, C.accent); }
        // the lead's headset has a microphone boom
        if (a.sprites.look.acc === "headset" && view !== "up") { p(view === "side" ? 8 : 12, 12, view === "side" ? 4 : 2, 1, O); p(view === "side" ? 12 : 11, 12, 1, 1, C.err); }
        break;
      case "glasses":
        if (view === "down") { p(3, 9, 4, 1, O); p(9, 9, 4, 1, O); p(3, 12, 4, 1, O); p(9, 12, 4, 1, O); p(7, 10, 2, 1, O); }
        if (view === "side") { p(10, 9, 4, 1, O); p(10, 12, 4, 1, O); p(13, 9, 1, 4, O); p(7, 10, 3, 1, O); }
        break;
      case "clip":
        p(10, 3, 3, 1, C.spark); p(11, 2, 1, 3, C.spark);
        break;
      case "ears":
        for (const [ex, outer] of view === "side" ? [[5, 0]] : [[3, 0], [10, 2]]) {
          p(ex + 1, -2, 1, 1, O);
          p(ex, -1, 3, 1, O); p(ex + 1, -1, 1, 1, "#ffb3c7");
          p(ex, 0, 3, 1, hair); p(ex + outer, 0, 1, 1, O);
        }
        break;
      case "ponytail":
        if (view === "side") { p(-2, 6, 3, 8, O); p(-1, 7, 2, 6, hair); }
        else { p(13, 5, 3, 9, O); p(14, 6, 1, 7, hair); }
        break;
      case "bow":
        p(10, 1, 5, 3, O); p(11, 2, 1, 1, "#ff5d8f"); p(13, 2, 1, 1, "#ff5d8f"); p(12, 2, 1, 1, "#ffd1df");
        break;
      case "beanie":
        p(3, -1, 10, 1, O); p(2, 0, 12, 4, a.sprites.pal.c); p(2, 4, 12, 1, O);
        p(3, 1, 10, 1, SPRITES.mix(a.sprites.look.clothes, 0.3)); p(7, -2, 2, 1, C.spark);
        break;
      case "ahoge":
        p(8, -3, 1, 3, hair); p(9, -4, 1, 2, hair); p(7, -2, 1, 1, dark);
        break;
    }
  };

  const typing = (a) => a.state === "work" && !a.place && !a.moving;

  const drawHands = (x, y, a, now) => {
    const hand = (hx, hy) => { px(hx, hy, 3, 3, O); px(hx + 1, hy + 1, 1, 1, SPRITES.SKIN); };
    if (a.state === "celebrate") {
      // Short chibi arms raised from the shoulders, hands at cheek height, waving out of step.
      const clothes = a.sprites.pal.c;
      for (const [ax, phase] of [[x - 8, 0], [x + 5, 1]]) {
        const wave = reduceMotion.matches ? 0 : Math.floor(now / 110 + phase) % 2;
        box(ax, y - 13 - wave, 3, 5 + wave, clothes);
        box(ax - (ax < x ? 1 : 0), y - 16 - wave, 4, 4, SPRITES.SKIN);
      }
      return;
    }
    if (typing(a)) return; // hidden behind the monitor
    hand(x - 6, y - 7); hand(x + 3, y - 7);
  };

  const leg = (lx, y, lift) => {
    px(lx, y - 5 - lift, 4, 5, O);
    px(lx + 1, y - 5 - lift, 2, 2, SPRITES.PANTS);
    px(lx + 1, y - 3 - lift, 2, 1, "#5a4a6a");
  };

  const bubbleKind = (a, now) => {
    const busy = a.state === "work" || a.state === "board" || a.state === "merge";
    if (!busy || a.moving) return null;
    if (now < a.bulbUntil) return "bulb";
    if (a.bubble && now < a.bubbleUntil) return a.bubble;
    if (now - a.lastAct > COFFEE_AFTER_MS && !a.lead) return "coffee";
    if (now - a.lastAct > THINK_AFTER_MS) return "think";
    return null;
  };

  const drawChar = (a, now) => {
    const S = a.sprites;
    const walking = a.moving && !reduceMotion.matches;
    const step = walking ? Math.floor(now / 130) % 4 : 0;
    let lift = 0;
    if (a.state === "celebrate" && !reduceMotion.matches) lift = Math.round(Math.abs(Math.sin(now / 110)) * 5);
    const nod = typing(a) && !reduceMotion.matches ? Math.floor(now / 380 + a.phase) % 2 : 0;
    const bob = walking && step % 2 ? 1 : 0;
    const x = Math.round(a.x), feet = Math.round(a.y);
    const y = feet - lift - bob;

    if (selected === a.id) {
      // selection ring on the floor
      px(x - 8, feet - 1, 16, 1, C.accent); px(x - 8, feet + 2, 16, 1, C.accent);
      px(x - 9, feet, 1, 2, C.accent); px(x + 8, feet, 1, 2, C.accent);
    }
    g.fillStyle = C.shadow;
    g.fillRect(x - 5, feet - 2, 10, 3);
    g.fillRect(x - 6, feet - 1, 12, 1);

    leg(x - 4, y, walking && step === 1 ? 1 : 0);
    leg(x, y, walking && step === 3 ? 1 : 0);

    const blink = (now + a.phase * 1000) % 3400 < 130;
    const side = a.face === "left" || a.face === "right";
    const spr = a.face === "up" ? S.up
      : side ? (blink ? S.sideBlink : S.side)
      : a.state === "celebrate" ? S.happy : blink ? S.blink : S.down;
    const flip = a.face === "left";
    const ox = x - 8, oy = y - 25 + nod;
    if (flip) { g.save(); g.translate(ox + 16, oy); g.scale(-1, 1); g.drawImage(spr, 0, 0); g.restore(); }
    else g.drawImage(spr, ox, oy);
    drawAccessory(a, ox, oy, flip);
    drawHands(x, y, a, now);
    if (a.carrying) { box(x - 4, y - 10, 8, 8, C.paper, C["paper-line"]); px(x - 2, y - 8, 4, 1, C["paper-line"]); px(x - 2, y - 6, 3, 1, C["paper-line"]); }

    if (now < a.sweatUntil) {
      const d = reduceMotion.matches ? 0 : Math.floor(now / 200) % 3;
      px(ox + 15, oy + 4 + d, 1, 1, C.sweat); px(ox + 14, oy + 5 + d, 3, 3, C.sweat); px(ox + 15, oy + 6 + d, 1, 1, "#ffffff");
    }
    if (a.state === "celebrate" && !reduceMotion.matches) {
      const t = Math.floor(now / 120) % 4;
      for (const [dx, dy] of [[-11, -20], [11, -24], [-9, -30], [12, -14]].slice(t % 2, t % 2 + 2)) {
        px(x + dx, y + dy - 1, 1, 3, C.spark); px(x + dx - 1, y + dy, 3, 1, C.spark);
      }
    }
    const kind = bubbleKind(a, now);
    if (kind) {
      // Beside the head, on the aisle side, so it never covers the desk below.
      const right = a.lead ? false : a.slot[0] < W / 2;
      const bx = right ? x + 9 : x - 24, by = oy + 1;
      px(bx + 1, by, 13, 12, C["bubble-line"]);
      px(bx, by + 1, 15, 10, C["bubble-line"]);
      px(bx + 1, by + 1, 13, 10, C.bubble);
      const tx = right ? bx - 2 : bx + 15;
      px(tx, by + 6, 2, 3, C["bubble-line"]); px(right ? tx + 1 : tx, by + 7, 1, 1, C.bubble);
      if (kind === "think") {
        const n = reduceMotion.matches ? 3 : 1 + (Math.floor(now / 350) % 3);
        for (let d = 0; d < n; d++) px(bx + 3 + d * 4, by + 6, 2, 2, C["bubble-line"]);
      } else {
        icon(ICONS[kind], bx + (kind === "bulb" || kind === "coffee" ? 4 : 3), by + 3, kind === "bulb" ? "#e0a800" : C["bubble-line"]);
      }
    }
  };

  // Walks `dt` seconds along the path, across as many waypoints as that distance covers.
  const stepWalk = (a, dt) => {
    let s = WALK_SPEED * dt;
    while (a.path.length && s > 0) {
      const [tx, ty] = a.path[0];
      const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy);
      if (d > 0.01) a.face = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
      if (d <= s) {
        a.x = tx; a.y = ty; a.path.shift(); s -= d;
        if (!a.path.length) { a.moving = false; const cb = a.onArrive; a.onArrive = null; cb?.(); }
      } else {
        a.x += (dx / d) * s; a.y += (dy / d) * s; a.moving = true; s = 0;
      }
    }
    if (!a.path.length) a.moving = false;
  };

  // Moves everyone forward in time. Driven by animation frames when the tab is visible and by
  // the list timer when it is hidden (browsers pause frames there), so the office is current
  // whenever the user comes back.
  let simAt = performance.now();
  const MAX_SIM_STEP_S = 2;
  const simulate = (now) => {
    const dt = Math.min(MAX_SIM_STEP_S, (now - simAt) / 1000);
    simAt = now;
    for (const a of agents.values()) {
      stepWalk(a, dt);
      if (a.state === "celebrate" && now > a.until) a.state = "idle";
    }
  };

  // ---------- pointer: hover tooltip and click to select ----------
  const tip = $("tip");
  const hitTest = (e) => {
    const r = view.getBoundingClientRect();
    const wx = ((e.clientX - r.left) / r.width) * W, wy = ((e.clientY - r.top) / r.height) * H;
    const frontFirst = [...agents.values()].sort((p, q) => q.y - p.y);
    const char = frontFirst.find((a) => Math.abs(wx - a.x) <= 8 && wy >= a.y - 26 && wy <= a.y + 2);
    if (char) return char;
    return workers().find((a) => Math.abs(wx - a.slot[0]) <= 17 && wy >= a.slot[1] - 12 && wy <= a.slot[1] + 16) ?? null;
  };
  view.addEventListener("mousemove", (e) => {
    const a = hitTest(e);
    view.style.cursor = a ? "pointer" : "default";
    if (!a) { tip.hidden = true; return; }
    const stage = $("stage").getBoundingClientRect();
    tip.textContent = `${a.name} — ${a.text || statusText(a, statusOf(a, performance.now()))}`;
    tip.hidden = false;
    tip.style.left = `${Math.min(e.clientX - stage.left + 12, stage.width - tip.offsetWidth - 8)}px`;
    tip.style.top = `${e.clientY - stage.top + 12}px`;
  });
  view.addEventListener("mouseleave", () => { tip.hidden = true; });
  view.addEventListener("click", (e) => { const a = hitTest(e); if (a) select(selected === a.id ? null : a.id); });

  // ---------- frame loop ----------
  let lastList = 0;
  const frame = (now) => {
    simulate(now);
    drawRoom(now);
    drawPrinter(now);
    const drawables = [{ y: TABLE.y + TABLE.h / 2, draw: drawTable }];
    for (const a of agents.values()) {
      if (!a.lead) {
        drawables.push({ y: a.slot[1] - 0.5, draw: () => drawChair(a.slot) });
        drawables.push({ y: a.slot[1] + 1, draw: () => drawDesk(a, now) });
      }
      drawables.push({ y: a.y, draw: () => drawChar(a, now) });
    }
    drawables.sort((p, q) => p.y - q.y).forEach((d) => d.draw());

    v.imageSmoothingEnabled = false;
    v.drawImage(world, 0, 0, W * scale, H * scale);
    // Desk name plates and progress bars, drawn at full resolution so the text stays sharp.
    v.font = `700 ${Math.max(10, Math.round(4.4 * scale))}px system-ui, sans-serif`;
    v.textAlign = "center";
    v.textBaseline = "middle";
    for (const a of workers()) {
      const tx = a.slot[0] * scale, ty = (a.slot[1] + 9) * scale;
      const w = v.measureText(a.name).width + 4 * scale, h = 5.5 * scale;
      v.fillStyle = C.paper; v.fillRect(tx - w / 2, ty - h / 2, w, h);
      v.fillStyle = a.hair; v.fillRect(tx - w / 2, ty - h / 2, scale, h);
      if (selected === a.id) { v.strokeStyle = C.accent; v.lineWidth = Math.max(1, scale / 2); v.strokeRect(tx - w / 2, ty - h / 2, w, h); }
      v.fillStyle = C.eye; v.fillText(a.name, tx, ty);
      const ratio = progressRatio(a);
      if (ratio != null) {
        const by = ty + h / 2 + scale * 0.6;
        v.fillStyle = C.line; v.fillRect(tx - w / 2, by, w, scale);
        v.fillStyle = a.endT ? C.ok : C.accent; v.fillRect(tx - w / 2, by, w * ratio, scale);
      }
    }

    // Empty room: say so, otherwise it reads as a broken page.
    if (!agents.size) {
      const dots = reduceMotion.matches ? "…" : ".".repeat(1 + (Math.floor(now / 500) % 3)).padEnd(3, " ");
      const fs = Math.max(12, Math.round(6 * scale));
      v.font = `600 ${fs}px system-ui, sans-serif`;
      const msg = `En attente des agents${dots}`;
      const sub = "Ils apparaîtront ici dès que l’audit les lance.";
      const w = Math.max(v.measureText(msg).width, v.measureText(sub).width * 0.75) + fs * 2;
      const cx = (W / 2) * scale, cy = (TABLE.y - 40) * scale;
      v.fillStyle = C.panel; v.globalAlpha = 0.92;
      v.fillRect(cx - w / 2, cy - fs * 1.6, w, fs * 3.4);
      v.globalAlpha = 1;
      v.fillStyle = C.text; v.fillText(msg, cx, cy - fs * 0.4);
      v.font = `${Math.round(fs * 0.75)}px system-ui, sans-serif`;
      v.fillStyle = C.muted; v.fillText(sub, cx, cy + fs * 0.9);
    }

    requestAnimationFrame(frame);
  };

  // ---------- events ----------
  const conn = $("conn");
  const es = new EventSource("/events");
  // An exported replay plays through a stand-in EventSource that names its own status.
  es.onopen = () => { conn.dataset.state = "open"; conn.textContent = es.statusLabel ?? "Connecté"; };
  es.onerror = () => { conn.dataset.state = "closed"; conn.textContent = ended ? "Passage terminé" : "Déconnecté"; };
  es.addEventListener("history", (e) => {
    apply({ kind: "reset" }, true);
    for (const ev of JSON.parse(e.data)) apply(ev, true);
  });
  es.onmessage = (e) => apply(JSON.parse(e.data));

  // The list and clock run on a timer, not on animation frames: browsers pause
  // requestAnimationFrame in background tabs, and the text must stay current there.
  setInterval(() => {
    const now = performance.now();
    if (document.hidden) simulate(now);
    if (dirty || now - lastList > LIST_REFRESH_MS) { renderList(now); dirty = false; lastList = now; }
  }, LIST_TICK_MS);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
